[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-defense-check"
version = "0.7.0a2"
description = "Yuanxingmu: persistent task authority, isolated execution, and verifiable agent defense"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/Invariant-Apache-2.0.txt"]
dependencies = []

[project.scripts]
defensecheck = "defensecheck.cli:main"
yuanxingmu = "yuanxingmu.cli:main"

[tool.setuptools.packages.find]
include = ["defensecheck*", "yuanxingmu*"]

[tool.setuptools.package-data]
yuanxingmu = ["integrations/openclaw/plugin/*.mjs", "integrations/openclaw/plugin/*.json", "integrations/openclaw/plugin/*.md", "integrations/hermes/plugin/*.py", "integrations/hermes/plugin/*.yaml", "integrations/hermes/*.md", "adapters/mastra/*.mjs", "adapters/mastra/*.json"]
"yuanxingmu.dashboard" = ["web/*"]
