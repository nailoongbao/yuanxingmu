name: Installer

on:
  push:
    paths:
      - 'install/**'
      - 'tests/test_yuanxingmu_installer.py'
      - '.github/workflows/installer.yml'
  pull_request:
    paths:
      - 'install/**'
      - 'tests/test_yuanxingmu_installer.py'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standard system directory permissions on disposable runner
        run: |
          # Hosted tool images can make /opt writable for tool installation.
          # The installer requires the ownership used by standard Ubuntu;
          # keep its production rejection of writable system ancestors intact.
          test -d /opt && test ! -L /opt
          stat -c '%n %U:%G %a' /opt
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          stat -c '%n %U:%G %a' /opt
      - name: Build installer from this exact commit
        run: /usr/bin/python3 install/build_zipapp.py --output "$RUNNER_TEMP/yuanxingmu-installer.pyz"
      - name: Install fixed public runtime and check actual Ubuntu isolation
        run: /usr/bin/python3 -I "$RUNNER_TEMP/yuanxingmu-installer.pyz" --install-root "$HOME/yuanxingmu-acceptance" --system-deps --no-shortcut
      - name: Exercise installed launcher and native OpenClaw and Hermes
        run: /usr/bin/python3 -I install/smoke_install.py --install-root "$HOME/yuanxingmu-acceptance" --framework both --report "$RUNNER_TEMP/installer-acceptance.json"
      - name: Verify a completed install without replacing runtime or work
        run: /usr/bin/python3 -I install/check_reuse.py --installer "$RUNNER_TEMP/yuanxingmu-installer.pyz" --install-root "$HOME/yuanxingmu-acceptance"
      - name: Upload public acceptance result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-acceptance
          path: ${{ runner.temp }}/installer-acceptance.json
          if-no-files-found: warn
