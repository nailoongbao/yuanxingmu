name: Yuanxingmu execution boundary

on:
  workflow_dispatch:
  push:
    paths:
      - 'yuanxingmu/**'
      - 'tests/test_yuanxingmu*'
      - 'pyproject.toml'
      - '.github/workflows/yuanxingmu.yml'
  pull_request:
    paths:
      - 'yuanxingmu/**'
      - 'tests/test_yuanxingmu*'
      - 'pyproject.toml'
      - '.github/workflows/yuanxingmu.yml'

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YUANXINGMU_TEST_BWRAP: /opt/yuanxingmu/bin/bwrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install packaged Linux isolation
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap apparmor python3-venv
          sudo install -d -o root -g root -m 0755 /opt/yuanxingmu /opt/yuanxingmu/bin
          sudo install -o root -g root -m 0755 /usr/bin/bwrap /opt/yuanxingmu/bin/bwrap
          cmp /usr/bin/bwrap /opt/yuanxingmu/bin/bwrap
          # Permit this executable to establish the namespaces used by sandbox.py.
          # The profile itself does not supply the sandbox's execution restrictions.
          sudo tee /etc/apparmor.d/yuanxingmu-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>

          profile yuanxingmu-bwrap /opt/yuanxingmu/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/yuanxingmu-bwrap
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"
      - name: Install package
        run: python -m pip install .
      - name: Require actual isolation availability
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/yuanxingmu-diagnostics"
          python -I -m yuanxingmu doctor --bwrap "$YUANXINGMU_TEST_BWRAP" | tee "$RUNNER_TEMP/yuanxingmu-diagnostics/doctor.json"
      - name: Install the isolated smolagents runtime
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/yxm-smolagents"
          "$RUNNER_TEMP/yxm-smolagents/bin/python" -m pip install -r docs/sdk-runtime-requirements.txt
          "$RUNNER_TEMP/yxm-smolagents/bin/python" -m pip check
      - name: Verify a complete SDK loop and recovery using a local deterministic provider
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/tests
        run: |
          "$RUNNER_TEMP/yxm-smolagents/bin/python" -m unittest tests.test_smolagents_runtime tests.test_smolagents_automatic_runtime -v
          YUANXINGMU_SMOLAGENTS_PYTHON="$RUNNER_TEMP/yxm-smolagents/bin/python" python -m unittest tests.test_yuanxingmu_sdk_runtime tests.test_yuanxingmu_sdk_model_store tests.test_yuanxingmu_sdk_boundary_failures -v
      - name: Verify authority, broker, command and process boundaries
        env:
          YUANXINGMU_SANDBOX_EVIDENCE_DIR: ${{ runner.temp }}/yuanxingmu-sandbox-evidence
        run: YUANXINGMU_TEST_NODE="$(command -v node)" python -m unittest discover -s tests -p 'test_yuanxingmu*.py' -v
      - name: Verify installed demo against independent receiver
        run: python -I -m yuanxingmu demo --bwrap "$YUANXINGMU_TEST_BWRAP" --output "$RUNNER_TEMP/yuanxingmu-receipts"
      - name: Preserve isolation diagnostics after failure
        if: failure()
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/yuanxingmu-diagnostics"
          {
            uname -a
            cat /etc/os-release
            dpkg-query -W bubblewrap apparmor
            stat -c '%n %U:%G %a' /opt/yuanxingmu /opt/yuanxingmu/bin /opt/yuanxingmu/bin/bwrap
            sha256sum /usr/bin/bwrap /opt/yuanxingmu/bin/bwrap
            sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces
            sudo aa-status
          } > "$RUNNER_TEMP/yuanxingmu-diagnostics/host.txt" 2>&1
          sudo dmesg --color=never 2>/dev/null | awk '/apparmor=/ && /(yuanxingmu-bwrap|unprivileged_userns|comm="bwrap")/' | tail -n 100 > "$RUNNER_TEMP/yuanxingmu-diagnostics/apparmor-bwrap.txt"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yuanxingmu-receipts
          path: |
            ${{ runner.temp }}/yuanxingmu-receipts
            ${{ runner.temp }}/yuanxingmu-sandbox-evidence
            ${{ runner.temp }}/yuanxingmu-diagnostics
          if-no-files-found: warn
          retention-days: 30
