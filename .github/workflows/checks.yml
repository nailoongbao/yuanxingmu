name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - name: Check installed CLI outside source import paths
        run: python -I -m defensecheck --help
      - name: Check packaged OpenClaw integration
        run: python -I -c "from importlib.resources import files; assert files('yuanxingmu').joinpath('integrations/openclaw/plugin/index.mjs').is_file()"
      - name: Check packaged workbench CLI and browser assets
        working-directory: ${{ runner.temp }}
        run: |
          python -I -m yuanxingmu desk --help
          python -I -c "from importlib.resources import files; root = files('yuanxingmu.dashboard').joinpath('web'); required = ('index.html', 'app.js', 'styles.css', 'mark.svg'); assert all(root.joinpath(name).is_file() and root.joinpath(name).read_bytes() for name in required), 'Packaged dashboard assets missing or empty'"
